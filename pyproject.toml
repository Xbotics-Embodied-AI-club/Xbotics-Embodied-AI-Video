# Xbotics 具身智能视频课的动手环境：星禾 SO-101 仿真（ManiSkill3 / SAPIEN）与 JupyterLab，每讲的 notebook 都在这个环境里跑。
#   uv sync          装到本目录的 .venv（Linux x86_64，NVIDIA 显卡与 Vulkan）
# 本仓库只有 notebook 与小工具，不是 Python 包。仿真器是独立的仓库 Xbotics-SO101-Sim，按提交钉住：升级时改下面的 rev，再 uv lock。
[project]
name = "xbotics-embodied-ai-video"
version = "0.1.0"
description = "Xbotics 具身智能视频课的动手代码：星禾 SO-101 仿真与 JupyterLab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "so101-sim",  # 仿真环境，经下面的 git 源
    "jupyterlab",
    "ipywidgets",  # 没有它，内核里导入 tqdm 时会打印一行「IProgress not found」的提示
    "matplotlib",
    "numpy",
    # so101-sim 只要求 torch >= 2.6、不选 CUDA 版本；这里把 torch 与 torchvision 列为直接依赖，才能用下面的 source 把它们钉在 CUDA 12.8 的源
    # （cu128 的轮子也支持 RTX 20 系列这样较老的显卡）
    "torch",
    "torchvision",
]

[tool.uv]
package = false  # 本仓库不是 Python 包，只装依赖
# 只解析 Linux x86_64：SAPIEN 的轮子主要在这个平台，别的平台的解析没有用处
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
so101-sim = { git = "https://github.com/Xbotics-Embodied-AI-club/Xbotics-SO101-Sim.git", rev = "239b38e076387b11d5c0b0da29487edcbde5f905" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
